name: Build Cryptidium Browser

# Manual only. Runs on a self-hosted Windows runner (needs VS 2022 C++, Git, Perl,
# Python, Ruby, CMake, Ninja, gperf). WebKit is kept between runs and built incrementally.
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        type: choice
        options: [Release, Debug]
        default: Release
      webkit_ref:
        description: WebKit branch, tag or commit to build
        type: string
        default: main

permissions:
  contents: read

env:
  WEBKIT_DIR: C:\cryptidium-ci\WebKit

jobs:
  build:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 360

    steps:
    - name: Checkout Cryptidium
      uses: actions/checkout@v4
      with:
        path: cryptidium

    - name: Resolve WebKit commit
      id: webkit
      shell: pwsh
      run: |
        $ref = "${{ inputs.webkit_ref }}"
        $sha = (git ls-remote https://github.com/WebKit/WebKit.git $ref | Select-Object -First 1) -split "\s+" | Select-Object -First 1
        if (-not $sha) { $sha = $ref }
        if ($sha -notmatch '^[0-9a-f]{7,40}$') { throw "Could not resolve WebKit ref '$ref'" }
        echo "sha=$sha" >> $env:GITHUB_OUTPUT
        echo "WebKit commit: $sha"

    - name: Sync WebKit
      shell: pwsh
      run: |
        if (-not (Test-Path "$env:WEBKIT_DIR\.git")) {
          New-Item -ItemType Directory -Force $env:WEBKIT_DIR | Out-Null
          git init $env:WEBKIT_DIR
        }
        git -C $env:WEBKIT_DIR fetch --depth 1 https://github.com/WebKit/WebKit.git "${{ steps.webkit.outputs.sha }}"
        git -C $env:WEBKIT_DIR checkout -f FETCH_HEAD
        git -C $env:WEBKIT_DIR log -1 --format="WebKit %H %s"

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build WebKit (WinCairo)
      shell: cmd
      working-directory: ${{ env.WEBKIT_DIR }}
      run: perl Tools\Scripts\build-webkit --${{ inputs.configuration == 'Debug' && 'debug' || 'release' }} --wincairo --ninja

    - name: Stage WebKit for Cryptidium
      shell: pwsh
      run: |
        $out = "$env:WEBKIT_DIR\WebKitBuild"
        $dest = "$env:GITHUB_WORKSPACE\cryptidium\WebKit"
        Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force "$dest\bin", "$dest\lib", "$dest\WebKit\Headers" | Out-Null

        $lib = Get-ChildItem $out -Recurse -Filter WebKit2.lib | Select-Object -First 1
        $dll = Get-ChildItem $out -Recurse -Filter WebKit2.dll | Select-Object -First 1
        $hdr = Get-ChildItem $out -Recurse -Filter WebKit2_C.h | Select-Object -First 1
        if (-not ($lib -and $dll -and $hdr)) { throw "Could not find WebKit2 lib/dll/headers under $out" }

        Copy-Item "$($lib.DirectoryName)\*" "$dest\lib" -Recurse -Force
        Copy-Item "$($dll.DirectoryName)\*" "$dest\bin" -Recurse -Force
        # Code includes <WebKit/WebKit2_C.h>, so the include root is the parent of the WebKit dir
        Copy-Item "$($hdr.Directory.Parent.FullName)\*" "$dest\WebKit\Headers" -Recurse -Force

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      shell: pwsh
      working-directory: cryptidium
      run: nuget restore Cryptidium.sln

    - name: Build Cryptidium
      shell: pwsh
      working-directory: cryptidium
      run: msbuild Cryptidium.sln /p:Configuration=${{ inputs.configuration }} /p:Platform=x64

    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: Cryptidium-Browser-${{ inputs.configuration }}
        path: cryptidium/x64/${{ inputs.configuration }}/
        if-no-files-found: error
